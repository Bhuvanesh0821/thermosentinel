name: Keep API awake

# Render's free instances sleep after 15 minutes without traffic, which would pause the
# server-side FIRMS ingestion and live alerts. This pings the public health endpoint every
# 10 minutes. Set the repository variable BACKEND_URL (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. https://thermosentinel-api.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/api/health" -o /dev/null; then
              echo "API awake"; exit 0
            fi
            echo "attempt $i failed; retrying"; sleep 20
          done
          echo "API did not respond"; exit 1
