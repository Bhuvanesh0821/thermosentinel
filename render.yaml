# Render Blueprint - ThermoSentinel API (FastAPI) next to the Neon database (Singapore).
# Render dashboard -> New -> Blueprint -> select this repository. Values marked `sync: false`
# are secrets or deployment-specific and are entered in the Render dashboard, never committed.
services:
  - type: web
    name: thermosentinel-api
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # Neon pooled connection string (ends in ?sslmode=require). Secret.
      - key: DATABASE_URL
        sync: false
      # Public URL of the Vercel frontend, e.g. https://thermosentinel.vercel.app (CORS + WebSocket origin).
      - key: FRONTEND_URL
        sync: false
      # Public URL of this API, e.g. https://thermosentinel-api.onrender.com (docs, links).
      - key: BACKEND_URL
        sync: false
      # Extra browser origins (comma-separated); FRONTEND_URL is always allowed.
      - key: CORS_ORIGINS
        value: ""
      # Protects POST /api/pipeline/run. Generated by Render; never shown to the browser.
      - key: ADMIN_API_TOKEN
        generateValue: true
      # Optional: NASA FIRMS Area API key. Empty -> keyless public NRT feed.
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: FIRMS_POLL_MINUTES
        value: "60"
      # Keep land-cover sampling and facility refresh light on the 512 MB free instance.
      - key: LANDCOVER_WORKERS
        value: "2"
      - key: LANDCOVER_MAX_SAMPLES_PER_RUN
        value: "300"
      - key: OVERPASS_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "3"
      # Optional alert delivery (leave empty to disable). Secrets.
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
